<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Blinkit Clone</title>
<link rel="stylesheet" href="style.css">
<!-- NAVBAR -->
<div class="navbar">
  <div class="logo">Patel Store</div>

  <input type="text" placeholder="Search..." onkeyup="searchProduct(this.value)">

  <div>
    <button onclick="openAuth()">Login</button>
    <button onclick="toggleCart()">🛒 (<span id="count">0</span>)</button>
  </div>
</div>

<!-- CATEGORIES -->
<div class="categories">
  <button onclick="filter('all')">All</button>
  <button onclick="filter('fruits')">Fruits</button>
  <button onclick="filter('snacks')">Snacks</button>
  <button onclick="filter('drinks')">Drinks</button>
</div>

<!-- PRODUCTS -->
<div class="products" id="products"></div>

<!-- CART -->
<div class="cart" id="cart">
  <div class="cart-header">
    <h2>Cart</h2>
    <button onclick="toggleCart()">❌</button>
  </div>

  <ul id="cartItems"></ul>

  <div class="total-box">
    Total: ₹<span id="total">0</span>
  </div>

  <div class="cart-actions">
    <button class="order-btn" onclick="openCheckout()">Place Order</button>
    <button class="clear-btn" onclick="clearCart()">Clear Cart</button>
    <button class="back-btn" onclick="goHome()">Back Home</button>
  </div>
</div>

<!-- CHECKOUT -->
<div class="checkout" id="checkout">
  <h3>Delivery Details</h3>

  <input id="name" placeholder="Name">
  <input id="place" placeholder="Place">
  <input id="pincode" placeholder="Pincode">
  <input id="mobile" placeholder="Mobile">
  <input id="area" placeholder="Area">

  <button onclick="placeOrder()">Confirm Order</button>
  <button onclick="closeCheckout()">Close</button>
</div>

<!-- LOGIN -->
<div class="auth" id="auth">
  <h3>Login</h3>
  <input placeholder="Username">
  <input placeholder="Password" type="password">
  <button onclick="closeAuth()">Back</button>
  <button onclick="alert('Logged In!')">Login</button>
</div>

let cart = JSON.parse(localStorage.getItem("cart")) || [];

// SHOW PRODUCTS
function show(data){
  let html="";
  data.forEach(p=>{
    html+=`
    <div class="card">
      <img src="${p.img}">
      <h3>${p.name}</h3>
      <p>₹${p.price}</p>
      <button onclick="add('${p.name}')">Add</button>
    </div>`;
  });
  document.getElementById("products").innerHTML=html;
}
show(products);

// FILTER
function filter(cat){
  if(cat=="all") show(products);
  else show(products.filter(p=>p.cat==cat));
}

// SEARCH
function searchProduct(val){
  show(products.filter(p=>p.name.toLowerCase().includes(val.toLowerCase())));
}

// ADD
function add(name){
  let item = cart.find(p=>p.name===name);
  if(item){
    item.qty++;
  } else {
    let prod = products.find(p=>p.name===name);
    cart.push({...prod, qty:1});
  }
  save();
}

// REMOVE
function removeItem(name){
  cart = cart.filter(p=>p.name!==name);
  save();
}

// QTY
function changeQty(name,val){
  let item = cart.find(p=>p.name===name);
  if(item){
    item.qty += val;
    if(item.qty<=0) removeItem(name);
  }
  save();
}

// CART UPDATE
function updateCart(){
  let html="";
  let total=0;

  cart.forEach(p=>{
    html+=`
    <li>
      ${p.name} ₹${p.price}
      <div>
        <button onclick="changeQty('${p.name}',-1)">-</button>
        ${p.qty}
        <button onclick="changeQty('${p.name}',1)">+</button>
        <button onclick="removeItem('${p.name}')">x</button>
      </div>
    </li>`;
    total += p.price * p.qty;
  });

  document.getElementById("cartItems").innerHTML = html || "Empty Cart";
  document.getElementById("total").innerText = total;
  document.getElementById("count").innerText = cart.length;
}

function save(){
  localStorage.setItem("cart",JSON.stringify(cart));
  updateCart();
}

updateCart();

// CART TOGGLE
function toggleCart(){
  let c=document.getElementById("cart");
  c.style.right = (c.style.right=="0px") ? "-380px":"0px";
}

// HOME
function goHome(){
  toggleCart();
  window.scrollTo({top:0,behavior:"smooth"});
}

// CLEAR
function clearCart(){
  cart=[];
  save();
}

// CHECKOUT
function openCheckout(){
  if(cart.length==0) return alert("Cart empty");
  document.getElementById("checkout").style.display="block";
}

function closeCheckout(){
  document.getElementById("checkout").style.display="none";
}

// ORDER
function placeOrder(){
  alert("Order Placed 🎉");
  cart=[];
  save();
  closeCheckout();
  toggleCart();
}

// LOGIN
function openAuth(){
  document.getElementById("auth").style.display="block";
}
function closeAuth(){
  document.getElementById("auth").style.display="none";
}
